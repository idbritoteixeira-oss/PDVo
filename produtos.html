<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDVo">
  <link rel="apple-touch-icon" href="./assets/icons/icon.php?size=180">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDVo - Produtos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/pdv.css">
</head>
<body>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/sidebar.js"></script>
  <script>renderSidebar('produtos.html');</script>

  <main class="main-content">
    <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
      <h1 class="text-2xl text-center font-bold">Gerenciar Produtos</h1>
      <button onclick="openModal()" class="btn btn-primary">+ Novo Produto</button>
    </div>

    <div class="card mb-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <input id="f-busca" type="text" class="input-dark" placeholder="Buscar..." oninput="loadProdutos()">
        <select id="f-categoria" class="input-dark" onchange="loadProdutos()">
          <option value="">Todas as Categorias</option>
        </select>
        <select id="f-ativo" class="input-dark" onchange="loadProdutos()">
          <option value="1">Ativos</option>
          <option value="">Todos</option>
          <option value="0">Inativos</option>
        </select>
        <label class="flex items-center gap-2 text-sm text-gray-500 cursor-pointer">
          <input id="f-estoque-baixo" type="checkbox" onchange="loadProdutos()" class="w-4 h-4">
          Estoque baixo
        </label>
      </div>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Código</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço Venda</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="produtos-body">
            <tr><td colspan="7" class="text-center py-6 text-gray-700">🗂️ Carregando...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="flex justify-between items-center mt-3 text-sm text-gray-700">
        <span id="total-info"></span>
        <div class="flex gap-2">
          <button id="btn-prev" onclick="changePage(-1)" class="btn btn-ghost btn-sm" disabled>‹ Anterior</button>
          <button id="btn-next" onclick="changePage(1)"  class="btn btn-ghost btn-sm" disabled>Próximo ›</button>
        </div>
      </div>
    </div>

    <div id="painel-assinatura"></div>
  </main>

  <!-- Modal produto -->
  <div id="modal-produto" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:600px">
      <h3 class="modal-title" id="modal-title">Novo Produto</h3>
      
      <form id="form-produto" class="grid grid-cols-2 gap-3" enctype="multipart/form-data">
        <input type="hidden" id="p-id" name="id">

        <div class="col-span-2 flex justify-center mb-2">
          <div class="relative group">
            <img id="p-preview" src="assets/img/no-image.jpeg" class="w-24 h-24 object-cover rounded-lg border-2 border-gray-700 bg-gray-800">
            <label for="p-file" class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 rounded-lg cursor-pointer transition-opacity text-[10px] uppercase font-bold text-white">Alterar Foto</label>
            <input type="file" id="p-file" name="imagem" accept="image/*" class="hidden" onchange="previewImage(this)">
          </div>
        </div>

        <div class="col-span-2">
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Nome *</label>
          <input id="p-nome" name="nome" type="text" class="input-dark" required placeholder="Nome do produto">
        </div>

        <div class="col-span-2">
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Código de Barras</label>
          <input id="p-barcode" name="codigo_barras" type="text" class="input-dark" placeholder="EAN/UPC">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Preço de Venda (R$) *</label>
          <input id="p-venda" name="preco_venda" type="number" class="input-dark" step="0.01" min="0" value="0" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Custo (R$)</label>
          <input id="p-custo" name="custo" type="number" class="input-dark" step="0.01" min="0" value="0" placeholder="0.00">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Categoria</label>
          <select id="p-categoria" name="categoria_id" class="input-dark">
            <option value="">Sem categoria</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Unidade</label>
          <select id="p-unidade" name="unidade" class="input-dark">
            <option value="UN">UN - Unidade</option>
            <option value="KG">KG - Quilograma</option>
            <option value="L">L - Litro</option>
            <option value="CX">CX - Caixa</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Estoque Inicial</label>
          <input id="p-estoque" name="estoque" type="number" class="input-dark" step="any" min="0" value="0">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Estoque Mínimo</label>
          <input id="p-estoque-min" name="estoque_minimo" type="number" class="input-dark" step="any" min="0" value="5">
        </div>

        <div id="p-ativo-wrapper" class="col-span-2 hidden">
          <label class="flex items-center gap-2 cursor-pointer text-sm">
            <input id="p-ativo" name="ativo" type="checkbox" checked class="w-4 h-4"> Produto ativo
          </label>
        </div>

        <div class="col-span-2 flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="btn btn-ghost flex-1 justify-center">Cancelar</button>
          <button type="submit" class="btn btn-primary flex-1 justify-center">Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm delete modal -->
  <div id="modal-delete" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:380px;text-align:center">
      <div class="text-4xl mb-3">🗑️</div>
      <h3 class="modal-title">Excluir Produto?</h3>
      <p class="text-sm text-gray-400 mb-5" id="del-nome-confirm">Este produto será excluído permanentemente.</p>
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()" class="btn btn-ghost flex-1">Cancelar</button>
        <button onclick="confirmarDelete()" class="btn btn-danger flex-1">Excluir</button>
      </div>
    </div>
  </div>

  <script>
    let offset = 0, limit = 20, total = 0;
    let _deleteId = null;

    async function init() {
      await checkAuth();
      await loadCategorias();
      await loadProdutos();
    }

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => document.getElementById('p-preview').src = e.target.result;
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function loadCategorias() {
      const res = await API.get('/categorias.php');
      if (!res?.ok) return;
      const pSel = document.getElementById('p-categoria');
      const fSel = document.getElementById('f-categoria');
      res.data.categorias.forEach(c => {
        pSel.add(new Option(c.nome, c.id));
        fSel.add(new Option(c.nome, c.id));
      });
    }

    async function loadProdutos() {
      const busca    = document.getElementById('f-busca').value;
      const catId    = document.getElementById('f-categoria').value;
      const ativo    = document.getElementById('f-ativo').value;
      const estBaixo = document.getElementById('f-estoque-baixo').checked;

      let url = `/produtos.php?limit=${limit}&offset=${offset}`;
      if (busca)    url += `&busca=${encodeURIComponent(busca)}`;
      if (catId)    url += `&categoria_id=${catId}`;
      if (ativo !== '') url += `&ativo=${ativo}`;
      if (estBaixo) url += `&estoque_baixo=1`;

      const res = await API.get(url);
      if (!res?.ok) return;

      const tbody = document.getElementById('produtos-body');
      total = res.data.total;
      document.getElementById('total-info').textContent = `Total de ${total} produto(s)`;
      document.getElementById('btn-prev').disabled = offset <= 0;
      document.getElementById('btn-next').disabled = (offset + limit) >= total;

      tbody.innerHTML = res.data.products.map(p => {
        const estoque = parseFloat(p.estoque || 0);
        const min     = parseFloat(p.estoque_minimo || 0);
        return `
          <tr>
            <td>
              <img src="${p.imagem_url || 'assets/img/no-image.jpeg'}" class="w-12 h-12 object-cover rounded border border-gray-700 bg-gray-800">
            </td>
            <td class="text-xs text-gray-600 font-mono">${p.codigo_barras || '-'}</td>
            <td><div class="font-medium">${p.nome}</div></td>
            <td class="text-sm text-gray-600">${p.categoria_nome || '-'}</td>
            <td class="font-semibold text-green-600">${formatCurrency(p.preco)}</td>
            <td class="font-semibold ${estoque <= min ? 'text-red-400' : 'text-green-600'}">
              ${formatNum(estoque)} ${p.unidade}
            </td>
            <td>
              <div class="flex gap-1 flex-wrap">
                <button onclick="editProduto(${JSON.stringify(p).replace(/"/g,'&quot;')})" class="btn btn-ghost btn-sm">Editar</button>
                <button onclick="abrirDeleteModal(${p.id}, '${p.nome.replace(/'/g,"\\'")}')" class="btn btn-danger btn-sm">Excluir</button>
              </div>
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="7" class="text-center py-6 text-gray-500">Nenhum produto encontrado.</td></tr>';
    }

    function openModal(prod = null) {
      document.getElementById('modal-produto').classList.remove('hidden');
      document.getElementById('form-produto').reset();
      document.getElementById('p-preview').src = prod?.imagem_url || 'assets/img/no-image.jpeg';
      document.getElementById('p-id').value    = prod?.id || '';
      document.getElementById('modal-title').textContent = prod ? 'Editar Produto' : 'Novo Produto';
      document.getElementById('p-ativo-wrapper').classList.toggle('hidden', !prod);
      if (prod) {
        document.getElementById('p-nome').value        = prod.nome;
        document.getElementById('p-venda').value       = prod.preco;
        document.getElementById('p-custo').value       = prod.custo || 0;
        document.getElementById('p-barcode').value     = prod.codigo_barras || '';
        document.getElementById('p-categoria').value   = prod.categoria_id || '';
        document.getElementById('p-unidade').value     = prod.unidade;
        document.getElementById('p-estoque').value     = formatNum(prod.estoque);
        document.getElementById('p-estoque-min').value = formatNum(prod.estoque_minimo);
        document.getElementById('p-ativo').checked     = !!prod.ativo;
      }
    }

    function editProduto(p) { openModal(p); }
    function closeModal()   { document.getElementById('modal-produto').classList.add('hidden'); }
    function changePage(dir){ offset += (dir * limit); loadProdutos(); }

    function abrirDeleteModal(id, nome) {
      _deleteId = id;
      document.getElementById('del-nome-confirm').textContent = `"${nome}" será desativado e não aparecerá mais nas listagens.`;
      document.getElementById('modal-delete').classList.remove('hidden');
    }
    function closeDeleteModal() { document.getElementById('modal-delete').classList.add('hidden'); _deleteId = null; }

    async function confirmarDelete() {
      if (!_deleteId) return;
      const res = await fetch(`./api/produtos.php?id=${_deleteId}`, {
        method: 'POST',
        headers: { 'X-HTTP-Method-Override': 'DELETE' },
        credentials: 'same-origin',
      });
      const data = await res.json();
      closeDeleteModal();
      if (res.ok) {
        toast(data.message || 'Produto excluído.', 'success');
        loadProdutos();
      } else {
        toast(data.error || 'Erro ao excluir.', 'error');
      }
    }

    document.getElementById('form-produto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id       = document.getElementById('p-id').value;
      const formData = new FormData(e.target);
      const res = await fetch(`./api/produtos.php${id ? '?id='+id : ''}`, {
        method:  'POST',
        body:    formData,
        headers: { 'X-HTTP-Method-Override': id ? 'PUT' : 'POST' }
      });
      const data = await res.json();
      if (!res.ok) {
        let msg = data.error || 'Erro ao salvar';
        if (data.suggestion) msg += '\n\n💡 Sugestão: ' + data.suggestion;
        alert('⚠️ ' + msg);
        return;
      }
      closeModal();
      toast(data.message || 'Produto salvo!', 'success');
      loadProdutos();
    });

    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
