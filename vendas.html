<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDVo">
  <link rel="apple-touch-icon" href="./assets/icons/icon.php?size=180">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDVo - Vendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/pdv.css">
</head>
<body>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/sidebar.js"></script>
  <script>renderSidebar('vendas.html');</script>

  <main class="main-content">
    <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
      <h1 class="text-2xl text-center font-bold">Histórico de Vendas</h1>
    </div>

    <!-- Filtros -->
    <div class="card mb-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Data Início</label>
          <input id="f-inicio" type="date" class="input-dark" onchange="loadVendas()">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Data Fim</label>
          <input id="f-fim" type="date" class="input-dark" onchange="loadVendas()">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Status</label>
          <select id="f-status" class="input-dark" onchange="loadVendas()">
            <option value="">Todos</option>
            <option value="concluida" selected>Concluídas</option>
            <option value="cancelada">Canceladas</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Forma de Pagamento</label>
          <select id="f-pagamento" class="input-dark" onchange="loadVendas()">
            <option value="">Todas</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao_credito">Cartão Crédito</option>
            <option value="cartao_debito">Cartão Débito</option>
            <option value="pix">PIX</option>
            <option value="fiado">Fiado</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Resumo -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="card text-center">
        <p class="text-gray-400 text-xs mb-1 uppercase font-semibold">Total de Vendas</p>
        <p id="res-total" class="text-xl font-black text-green-400">R$ 0,00</p>
      </div>
      <div class="card text-center">
        <p class="text-gray-400 text-xs mb-1 uppercase font-semibold">Qtd Transações</p>
        <p id="res-qtd" class="text-xl font-black text-blue-400">0</p>
      </div>
      <div class="card text-center">
        <p class="text-gray-400 text-xs mb-1 uppercase font-semibold">Ticket Médio</p>
        <p id="res-ticket" class="text-xl font-black text-purple-400">R$ 0,00</p>
      </div>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nº Venda</th>
              <th>Data/Hora</th>
              <th>Operador</th>
              <th>Pagamento</th>
              <th>Total</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="vendas-body">
            <tr><td colspan="7" class="text-center py-6 text-gray-500">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

<div id="painel-assinatura"></div>

  </main>

  <!-- Modal Detalhe Venda -->
  <div id="modal-venda" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:580px">
      <h3 class="modal-title" id="modal-venda-title">Detalhes da Venda</h3>
      <div id="modal-venda-content">
        <div class="spinner"></div>
      </div>
      <div class="flex gap-2 mt-4">
        <button onclick="document.getElementById('modal-venda').classList.add('hidden')" class="btn btn-ghost flex-1 justify-center">Fechar</button>
        <button id="btn-cancelar-venda" class="btn btn-danger flex-1 justify-center hidden">Cancelar Venda</button>
      </div>
    </div>
  </div>

  <script>
    let vendas = [];

    async function init() {
      await checkAuth();
      // Definir datas padrão: mês atual
      const hoje = new Date();
      const primDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
      document.getElementById('f-inicio').value = primDia;
      document.getElementById('f-fim').value = hoje.toISOString().split('T')[0];
      await loadVendas();
    }

    async function loadVendas() {
      const inicio  = document.getElementById('f-inicio').value;
      const fim     = document.getElementById('f-fim').value;
      const status  = document.getElementById('f-status').value;
      const pagto   = document.getElementById('f-pagamento').value;

      let url = '/vendas.php?limit=100';
      if (inicio) url += `&data_inicio=${inicio}`;
      if (fim)    url += `&data_fim=${fim}`;
      if (status) url += `&status=${status}`;
      if (pagto)  url += `&forma_pagamento=${pagto}`;

      const res = await API.get(url);
      if (!res?.ok) { toast('Erro ao carregar vendas.', 'error'); return; }
      vendas = res.data.vendas;

      const total  = vendas.filter(v => v.status === 'concluida').reduce((s, v) => s + parseFloat(v.total), 0);
      const qtd    = vendas.filter(v => v.status === 'concluida').length;
      document.getElementById('res-total').textContent  = formatCurrency(total);
      document.getElementById('res-qtd').textContent    = qtd;
      document.getElementById('res-ticket').textContent = formatCurrency(qtd ? total / qtd : 0);

      const pagtoMap = {
        dinheiro: '💵 Dinheiro', cartao_credito: '💳 Crédito',
        cartao_debito: '💳 Débito', pix: '📱 PIX', fiado: '📋 Fiado', misto: '🔀 Misto',
      };

      const tbody = document.getElementById('vendas-body');
      if (!vendas.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-500">Nenhuma venda encontrada.</td></tr>';
        return;
      }
      tbody.innerHTML = vendas.map(v => `
        <tr>
          <td class="font-mono text-blue-400 text-sm">${v.numero_venda}</td>
          <td class="text-sm text-gray-600">${new Date(v.created_at).toLocaleString('pt-BR')}</td>
          <td class="text-sm">${v.operador_nome}</td>
          <td class="text-sm">${pagtoMap[v.forma_pagamento] || v.forma_pagamento}</td>
          <td class="font-bold text-green-400">${formatCurrency(v.total)}</td>
          <td><span class="badge ${v.status === 'concluida' ? 'badge-success' : 'badge-danger'}">${v.status}</span></td>
          <td>
            <button onclick="verVenda(${v.id})" class="btn btn-ghost btn-sm">Detalhes</button>
          </td>
        </tr>
      `).join('');
    }

    let currentVendaId = null;
    async function verVenda(id) {
      currentVendaId = id;
      document.getElementById('modal-venda').classList.remove('hidden');
      document.getElementById('modal-venda-content').innerHTML = '<div class="spinner"></div>';
      document.getElementById('btn-cancelar-venda').classList.add('hidden');

      const res = await API.get(`/vendas.php?id=${id}`);
      if (!res?.ok) { toast('Erro ao carregar venda.', 'error'); return; }
      const v = res.data.venda;

      document.getElementById('modal-venda-title').textContent = `Venda ${v.numero_venda}`;
      if (v.status === 'concluida') {
        document.getElementById('btn-cancelar-venda').classList.remove('hidden');
        document.getElementById('btn-cancelar-venda').onclick = () => cancelarVenda(v.id);
      }

      document.getElementById('modal-venda-content').innerHTML = `
        <div class="grid grid-cols-2 gap-2 text-sm mb-4">
          <div><span class="text-gray-400">Data:</span> ${new Date(v.created_at).toLocaleString('pt-BR')}</div>
          <div><span class="text-gray-400">Operador:</span> ${v.operador_nome}</div>
          <div><span class="text-gray-400">Pagamento:</span> ${v.forma_pagamento.replace('_',' ')}</div>
          <div><span class="text-gray-400">Status:</span> <span class="badge ${v.status === 'concluida' ? 'badge-success' : 'badge-danger'}">${v.status}</span></div>
        </div>
        <h4 class="text-sm font-semibold text-gray-300 mb-2">Itens da Venda</h4>
        <div class="table-wrapper mb-3">
          <table>
            <thead><tr><th>Produto</th><th>Qtd</th><th>Unit.</th><th>Total</th></tr></thead>
            <tbody>
              ${v.itens.map(i => `
                <tr>
                  <td class="text-sm">${i.produto_nome}</td>
                  <td>${parseFloat(i.quantidade).toFixed(2)} ${i.unidade}</td>
                  <td>${formatCurrency(i.preco_unitario)}</td>
                  <td class="font-semibold">${formatCurrency(i.subtotal)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="space-y-1 text-sm border-t border-gray-700 pt-3">
          <div class="flex justify-between"><span class="text-gray-400">Subtotal:</span><span>${formatCurrency(v.subtotal)}</span></div>
          ${parseFloat(v.desconto) > 0 ? `<div class="flex justify-between"><span class="text-gray-400">Desconto:</span><span class="text-red-400">-${formatCurrency(v.desconto)}</span></div>` : ''}
          <div class="flex justify-between font-bold text-base border-t border-gray-700 pt-2 mt-2">
            <span>TOTAL:</span><span class="text-blue-400">${formatCurrency(v.total)}</span>
          </div>
          ${parseFloat(v.troco) > 0 ? `<div class="flex justify-between"><span class="text-gray-400">Troco:</span><span class="text-green-400">${formatCurrency(v.troco)}</span></div>` : ''}
        </div>
      `;
    }

    async function cancelarVenda(id) {
      if (!window.confirm('Cancelar esta venda? O estoque será restaurado automaticamente.')) return;
      const res = await API.put('/vendas.php', { id, status: 'cancelada' });
      if (!res?.ok) { toast(res?.data?.error || 'Erro ao cancelar.', 'error'); return; }
      toast(res.data.message, 'success');
      document.getElementById('modal-venda').classList.add('hidden');
      loadVendas();
    }

    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
